name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest -v --cov=secure_mcp_server --cov-report=term-missing
      env:
        MCP_BEARER_TOKEN: test-token-for-ci
    
    - name: Check for forbidden strings
      run: |
        if grep -r -i "conexus\|gidney\|lobster\|tara@" --exclude-dir=.git --exclude-dir=.github .; then
          echo "ERROR: Found forbidden strings in repository"
          exit 1
        fi
        echo "✓ No forbidden strings found"
